<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title> Astroid Game </title>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <link rel="stylesheet" type="text/css" href="https://www.w3schools.com/w3css/5/w3.css">  
</head>
<body>
<!-- Start Screen -->
 <div id="startScreen">
    <header>
        <h1> Asteroid Game </h1>
         <button id="startBtn" class="btn">Start</button>
         <button id="scoresBtn" class="btn">Scores</button>
    </header>
</div>

<!-- Game Screen -->
 <div id="gameScreen" style="display:none;">
    <main>
        <canvas id="asteroid-game-canvas" width="700" height="720" style="border:1px solid #f5f3f3;"></canvas>
        <p>Score: <span id="score">0</span></p>
        <input type="text" id="typeInput" placeholder="Type here..." autocomplete="off">
    </main>
 </div>

 <!-- Game Over Screen-->
  <div id="gameOverScreen" style="display: none;">
    <header>
        <h2> Game Over!</h2>
        <p> Your score: <span id="finalScore">0</span></p>
        <button id="mulliganBtn" class="btn">Mulligan</button>
    </header>
  </div>
    

    <footer class="w3-margin-top">
        <p>&copy; 2025 Jos J Portfolio. All rights reserved.</p>
        <a href="https://www.linkedin.com/in/joshuajames">LinkedIn</a> |
        <a href="https://github.com/Jos-J">GitHub</a>
    </footer>

    <script src="./api.js"></script>
    <script src="./game.js"></script>  
</body>
</html>
